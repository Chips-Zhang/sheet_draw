[project]
name = "sheet-draw"
version = "0.1.0"
description = "乐谱绘制工具 - 将音频转换为简谱"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "chips"}
]
keywords = ["sheet", "music", "jianpu", "audio", "notation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "soundfile>=0.10.0",
    "av>=15; python_version >= '3.9'",
    "urllib3>=2,<3; python_version >= '3.9'",
    "yt-dlp>=2024.10.22; python_version >= '3.9'",
]

[project.optional-dependencies]
separation = ["demucs==4.0.1", "torch==2.5.1", "torchaudio==2.5.1", "numpy<2"]
neural = ["basic-pitch[onnx]==0.4.0", "numpy<2", "setuptools<81"]
full = [
    "mido>=1.2.0",
    "matplotlib>=3.5.0",
    "spleeter>=2.3.0",
]
dev = [
    "pytest>=6.0",
    "black>=22.0",
    "flake8>=4.0",
    "mido>=1.2.0",
    "matplotlib>=3.5.0",
]
spleeter = [
    "spleeter>=2.3.0",
]

[project.scripts]
sheet-draw = "sheet_draw.cli:main"

[project.urls]
Homepage = "https://github.com/chips/sheet-draw"
Repository = "https://github.com/chips/sheet-draw"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
sheet_draw = ["web_assets/*"]
